<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folded Manual — Prototype</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; overflow: hidden; font-family: system-ui; color: #fff; user-select: none; }
#c { width: 100vw; height: 100vh; display: block; }
#hud {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); padding: 12px 24px; border-radius: 30px;
  backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; gap: 14px; z-index: 10; font-size: 13px;
}
#hud button {
  background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff;
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
#hud button:hover { background: rgba(255,255,255,0.1); }
#info { min-width: 220px; text-align: center; opacity: 0.7; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="prev">‹</button>
  <span id="info">…</span>
  <button id="next">›</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── CONFIGURATION ──────────────────────────────────────────────────────────
// Total panels must be divisible by 4 and >= 8
const TOTAL_PANELS = parseInt(new URLSearchParams(location.search).get('panels')) || 24;
const PANELS_PER_SIDE = TOTAL_PANELS / 2;
const COLS = 2;
const ROWS = PANELS_PER_SIDE / COLS;       // rows per side
const W = 1.414;                            // A4 landscape width
const H = 1.0;                              // A4 landscape height
const STACK_GAP = 0.005;
const NUM_FOLDS = ROWS - 1;                 // sequential row folds
const GEO_SEGS_X = 32;                      // segments along width (smooth roll)
const GEO_SEGS_Y = 24;                      // segments along height
const CRUMPLE_AMP = 0.0;                     // disabled for debugging

// Texture canvas size (matches A4 landscape ratio ≈ √2 : 1)
const TEX_W = 512, TEX_H = 362;

// ─── DERIVE PAGE NUMBERING ─────────────────────────────────────────────────
function frontPage(row, col) { return row * 2 + col + 1; }
function backPage(row, col)  { return PANELS_PER_SIDE + row * 2 + (1 - col) + 1; }

// ─── THREE.JS SETUP ────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xfff8f0, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(4, 10, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
sun.shadow.bias = -0.001;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xddeeff, 0.3);
fill.position.set(-3, 5, -4); scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0.0 })
);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.05;
ground.receiveShadow = true; scene.add(ground);

// ─── LOAD PAPER MATERIAL IMAGE ────────────────────────────────────────────
// We need the decoded HTMLImageElement so we can BAKE the page label into the
// paper texture per panel — this kills bleed-through and missing-label bugs
// that came from transparent overlay meshes.
const paperImage = new Image();
paperImage.crossOrigin = 'anonymous';
let imageOk = false;
let bumpOk = false;
const imageReady = new Promise((res) => {
  paperImage.onload = () => { imageOk = true; res(); };
  paperImage.onerror = () => res();
});
paperImage.src = 'material_6.png';

// Bump map shares the same source file as the paper image. Wait for it too so
// that `bumpOk` is settled before `makePanel()` builds the materials.
let paperBumpTex = null;
const bumpReady = new Promise((res) => {
  paperBumpTex = new THREE.TextureLoader().load(
    'material_6.png',
    (tex) => {
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      bumpOk = true;
      res();
    },
    undefined,
    () => res()
  );
});

// ─── LOAD SLIDE IMAGES ──────────────────────────────────────────────────────
const slideImages = {};  // keyed by panel number (1-based)
function loadSlide(num) {
  return new Promise((res) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { slideImages[num] = img; res(); };
    img.onerror = () => res();  // graceful fallback if missing
    img.src = `slides/panel-${String(num).padStart(2, '0')}.png`;
  });
}
const slidesReady = Promise.all(
  Array.from({length: TOTAL_PANELS}, (_, i) => loadSlide(i + 1))
);

const paperImageReady = Promise.all([imageReady, bumpReady, slidesReady]).then(() => {
  if (!imageOk) {
    console.info('material_6.png unavailable — using flat paper color fallback');
  }
  console.info(`Loaded ${Object.keys(slideImages).length}/${TOTAL_PANELS} slide images`);
});

// ─── BAKED TEXTURE: paper material + slide image, no overlay meshes ────────
// Higher resolution canvas for slide images
const TEX_SLIDE_W = 1024, TEX_SLIDE_H = 683;  // ~3:2 aspect

// Map physical panel positions to slide numbers.
// Identity mapping: physical position N = slide N.
const SLIDE_MAP = {};
(function buildSlideMap() {
  for (let i = 1; i <= TOTAL_PANELS; i++) SLIDE_MAP[i] = i;
})();

function makeBakedTex(label, side) {
  const physicalNum = parseInt(label, 10);
  const slideNum = SLIDE_MAP[physicalNum] || physicalNum;
  const hasSlide = slideImages[slideNum];
  const cW = hasSlide ? TEX_SLIDE_W : TEX_W;
  const cH = hasSlide ? TEX_SLIDE_H : TEX_H;

  const c = document.createElement('canvas');
  c.width = cW; c.height = cH;
  const ctx = c.getContext('2d');

  // 1. Paper material as base layer
  if (imageOk) {
    ctx.drawImage(paperImage, 0, 0, cW, cH);
  } else {
    ctx.fillStyle = '#e8e1cf';
    ctx.fillRect(0, 0, cW, cH);
  }

  // 2. Faint cool tint on the back so the two sides feel different
  if (side === 'back') {
    ctx.fillStyle = 'rgba(40,38,34,0.06)';
    ctx.fillRect(0, 0, cW, cH);
  }

  // 3. Content: slide image or fallback page number
  ctx.save();
  if (side === 'back') {
    ctx.translate(cW/2, cH/2);
    ctx.rotate(Math.PI);
    ctx.translate(-cW/2, -cH/2);
  }

  if (hasSlide) {
    // Darken blend at 90%: paper texture shows through the slide
    ctx.globalCompositeOperation = 'darken';
    ctx.globalAlpha = 0.9;
    ctx.drawImage(slideImages[slideNum], 0, 0, cW, cH);
    ctx.globalAlpha = 1.0;
    ctx.globalCompositeOperation = 'source-over';
  } else {
    // Fallback: page number (for any missing slide images)
    ctx.fillStyle = 'rgba(30,28,25,0.85)';
    ctx.font = 'bold 100px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, cW/2, cH/2 - 20);

    ctx.font = '18px Georgia, serif';
    ctx.fillStyle = 'rgba(30,28,25,0.5)';
    ctx.fillText('— ' + label + ' —', cW/2, cH/2 + 80);

    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 1;
    ctx.strokeRect(15, 15, cW - 30, cH - 30);
  }
  ctx.restore();

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

// ─── CRUMPLE NOISE ─────────────────────────────────────────────────────────
function hashN(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) & 0x7fffffff) / 0x7fffffff;
}
function smoothNoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const n00 = hashN(ix, iy),     n10 = hashN(ix+1, iy);
  const n01 = hashN(ix, iy+1),   n11 = hashN(ix+1, iy+1);
  return (n00*(1-sx) + n10*sx)*(1-sy) + (n01*(1-sx) + n11*sx)*sy;
}
function globalCrumple(worldX, worldZ) {
  let v = 0;
  v += smoothNoise(worldX * 1.2 + 3.7,  worldZ * 1.2 + 1.3) * 1.0;
  v += smoothNoise(worldX * 2.8 + 7.1,  worldZ * 2.8 + 4.2) * 0.4;
  v += smoothNoise(worldX * 6.0 + 11.3, worldZ * 6.0 + 2.7) * 0.15;
  return (v - 0.78) * 2.0 * CRUMPLE_AMP;
}

// ─── PANEL MESH REGISTRY ───────────────────────────────────────────────────
const allPanelMeshes = [];

function makePanel(fp, bp, panelCenterX, panelCenterZ) {
  const g = new THREE.Group();

  const frontGeo = new THREE.PlaneGeometry(W, H, GEO_SEGS_X, GEO_SEGS_Y);
  const fPos = frontGeo.attributes.position;
  for (let i = 0; i < fPos.count; i++) {
    const lx = fPos.getX(i), ly = fPos.getY(i);
    const wx = panelCenterX + lx;
    const wz = panelCenterZ - ly;
    fPos.setZ(i, globalCrumple(wx, wz));
  }
  fPos.needsUpdate = true;
  frontGeo.computeVertexNormals();

  const backGeo = frontGeo.clone();
  const bPos = backGeo.attributes.position;
  for (let i = 0; i < bPos.count; i++) bPos.setZ(i, -bPos.getZ(i));
  bPos.needsUpdate = true;
  backGeo.computeVertexNormals();

  const frontMatOpts = {
    map: makeBakedTex('' + fp, 'front'),
    roughness: 0.82,
    metalness: 0.0,
    side: THREE.FrontSide,
  };
  const backMatOpts = {
    map: makeBakedTex('' + bp, 'back'),
    roughness: 0.85,
    metalness: 0.0,
    side: THREE.FrontSide,
  };
  if (bumpOk) {
    frontMatOpts.bumpMap = paperBumpTex;
    frontMatOpts.bumpScale = 0.02;
    backMatOpts.bumpMap = paperBumpTex;
    backMatOpts.bumpScale = 0.02;
  }
  const frontMat = new THREE.MeshStandardMaterial(frontMatOpts);
  const backMat = new THREE.MeshStandardMaterial(backMatOpts);

  const front = new THREE.Mesh(frontGeo, frontMat);
  front.rotation.x = -Math.PI / 2;
  front.castShadow = true; front.receiveShadow = true;
  g.add(front);

  const back = new THREE.Mesh(backGeo, backMat);
  back.rotation.x = Math.PI / 2;
  back.castShadow = true; back.receiveShadow = true;
  g.add(back);

  allPanelMeshes.push({ mesh: front, geo: frontGeo, isFront: true });
  allPanelMeshes.push({ mesh: back,  geo: backGeo,  isFront: false });

  return g;
}

// ─── PAPER HIERARCHY ───────────────────────────────────────────────────────
// (Built lazily inside startScene() — needs paperImage to be loaded so the
// baked textures contain the actual paper material rather than blank.)
const paperGroup = new THREE.Group();
scene.add(paperGroup);
let leftData, rightData, centralHinge;

function rowZ(r)    { return (r - (ROWS-1)/2) * H; }
function creaseZ(r) { return (rowZ(r) + rowZ(r+1)) / 2; }

function buildColumn(xOffset) {
  const colGroup = new THREE.Group();
  const foldHinges = [];
  const col = xOffset > 0 ? 1 : 0;

  // Base is row ROWS-1 (bottom). Row folds stack upward.
  // The central fold then flips the left column over, inverting Y —
  // so the base (row 5, bottom) ends up on TOP after the fold-over.
  const baseRow = makePanel(
    '' + frontPage(ROWS-1, col),
    '' + backPage(ROWS-1, col),
    xOffset, rowZ(ROWS-1)
  );
  baseRow.position.set(xOffset, 0, rowZ(ROWS-1));
  colGroup.add(baseRow);

  let parentGroup = colGroup;
  for (let f = NUM_FOLDS - 1; f >= 0; f--) {
    const hinge = new THREE.Group();
    if (f === NUM_FOLDS - 1) hinge.position.set(xOffset, 0, creaseZ(f));
    else                     hinge.position.set(0, 0, creaseZ(f) - creaseZ(f + 1));
    parentGroup.add(hinge);
    foldHinges[f] = hinge;

    const panel = makePanel(
      '' + frontPage(f, col),
      '' + backPage(f, col),
      xOffset, rowZ(f)
    );
    panel.position.set(0, 0, -(H/2));
    hinge.add(panel);

    parentGroup = hinge;
  }
  return { group: colGroup, hinges: foldHinges };
}

function buildPaper() {
  rightData = buildColumn( W/2);
  paperGroup.add(rightData.group);

  centralHinge = new THREE.Group();
  paperGroup.add(centralHinge);

  leftData = buildColumn(-W/2);
  centralHinge.add(leftData.group);

  // Crease lines removed for clean presentation look
}

// ─── ANIMATION STATE ───────────────────────────────────────────────────────
const state  = { folds: new Array(NUM_FOLDS).fill(0), central: 0, flipAngle: 0 };
const target = { folds: new Array(NUM_FOLDS).fill(0), central: 0, flipAngle: 0 };
let camPosT  = new THREE.Vector3(0, 5, 4);
let camLookT = new THREE.Vector3(0, 0, 0);

// ─── STEP DEFINITIONS ──────────────────────────────────────────────────────
const UNFOLD_STEPS    = 2 + NUM_FOLDS;
const FRONT_ZOOM_START = UNFOLD_STEPS;
const FRONT_ZOOM_END   = FRONT_ZOOM_START + PANELS_PER_SIDE - 1;
const FRONT_OVERVIEW   = FRONT_ZOOM_END + 1;
const FLIP_STEP        = FRONT_OVERVIEW + 1;
const BACK_ZOOM_START  = FLIP_STEP + 1;
const BACK_ZOOM_END    = BACK_ZOOM_START + PANELS_PER_SIDE - 2;
const BACK_OVERVIEW    = BACK_ZOOM_END + 1;
const TOTAL_STEPS      = BACK_OVERVIEW + 1;

function camForExtent(width, height, cx = 0, cz = 0) {
  const fov = 45 * Math.PI / 180;
  const aspect = innerWidth / innerHeight || 16/9;
  const distH = (height / 2) / Math.tan(fov / 2);
  const distW = (width / 2) / (Math.tan(fov / 2) * aspect);
  const dist = Math.max(distH, distW, 2.0) * 1.3;
  return { pos: [cx, dist * 0.82, cz + dist * 0.6], look: [cx, 0, cz] };
}
function overviewCam() { return camForExtent(W * 2, ROWS * H, 0, 0); }
function unfoldCenter(numRowsVisible, centralOpen) {
  const cx = centralOpen ? 0 : W/4;
  const bottomZ = rowZ(ROWS - 1);
  const topZ    = rowZ(ROWS - numRowsVisible);
  return { cx, cz: (bottomZ + topZ) / 2 };
}
function panelWorldPos(page) {
  const side = page <= PANELS_PER_SIDE ? 'front' : 'back';
  const idx  = side === 'front' ? page - 1 : page - PANELS_PER_SIDE - 1;
  const row  = Math.floor(idx / 2);
  const col  = idx % 2;
  return { x: col === 0 ? -W/2 : W/2, z: rowZ(row) };
}

function getStepConfig(s) {
  const ov = overviewCam();
  if (s < UNFOLD_STEPS) {
    const folds = new Array(NUM_FOLDS).fill(0);
    if (s === 0) {
      folds.fill(Math.PI);
      const coverPage = backPage(ROWS-1, 0);  // bottom-left back = 24 after central flip
      // Camera straight above the folded stack, filling frame
      // The cover panel lands at approximately (W/2, ~0.09, rowZ(ROWS-1))
      const coverX = W / 2;
      const coverZ = rowZ(ROWS - 1);
      const fov = 45 * Math.PI / 180;
      const aspect = innerWidth / innerHeight || 16/9;
      const fitH = (H / 2) / Math.tan(fov / 2);
      const fitW = (W / 2) / (Math.tan(fov / 2) * aspect);
      const dist = Math.max(fitH, fitW) * 1.02;
      return { folds, central: -Math.PI, flipAngle: 0,
        pos: [coverX, dist, coverZ], look: [coverX, 0, coverZ],
        label: 'Cover — Slide ' + (SLIDE_MAP[coverPage] || coverPage) };
    }
    if (s === 1) {
      folds.fill(Math.PI);
      const { cx, cz } = unfoldCenter(1, true);
      const cam = camForExtent(W * 2.2, H * 1.2, cx, cz);
      return { folds, central: 0, flipAngle: 0, ...cam, label: 'Central open' };
    }
    const numUnfolded = s - 1;
    for (let f = 0; f < NUM_FOLDS; f++) {
      folds[f] = (f >= NUM_FOLDS - numUnfolded) ? 0 : Math.PI;
    }
    const visibleRows = numUnfolded + 1;
    const { cx, cz } = unfoldCenter(visibleRows, true);
    const cam = camForExtent(W * 2.1, visibleRows * H * 1.1, cx, cz);
    const label = numUnfolded === NUM_FOLDS
      ? 'Full front — Pages 1–' + PANELS_PER_SIDE
      : 'Unfolding… (' + numUnfolded + '/' + NUM_FOLDS + ')';
    return { folds, central: 0, flipAngle: 0, ...cam, label };
  }
  if (s >= FRONT_ZOOM_START && s <= FRONT_ZOOM_END) {
    const page = s - FRONT_ZOOM_START + 1;
    const p = panelWorldPos(page);
    const single = camForExtent(W * 1.1, H * 1.1);
    const dist = Math.sqrt(single.pos[1]**2 + single.pos[2]**2);
    return { folds: new Array(NUM_FOLDS).fill(0), central: 0, flipAngle: 0,
      pos: [p.x, dist * 0.75, p.z + dist * 0.55], look: [p.x, 0, p.z],
      label: 'Slide ' + (SLIDE_MAP[page] || page) };
  }
  if (s === FRONT_OVERVIEW) {
    return { folds: new Array(NUM_FOLDS).fill(0), central: 0, flipAngle: 0,
      ...ov, label: 'Full front side' };
  }
  if (s === FLIP_STEP) {
    const flipCam = camForExtent(W * 2.5, ROWS * H * 1.2);
    return { folds: new Array(NUM_FOLDS).fill(0), central: 0, flipAngle: Math.PI,
      pos: [flipCam.pos[0], flipCam.pos[1] + W * 1.2, flipCam.pos[2] * 1.05],
      look: [0, 0, 0], label: 'Flipping…' };
  }
  if (s >= BACK_ZOOM_START && s <= BACK_ZOOM_END) {
    const page = PANELS_PER_SIDE + (s - BACK_ZOOM_START) + 1;
    const p = panelWorldPos(page);
    const single = camForExtent(W * 1.1, H * 1.1);
    const dist = Math.sqrt(single.pos[1]**2 + single.pos[2]**2);
    return { folds: new Array(NUM_FOLDS).fill(0), central: 0, flipAngle: Math.PI,
      pos: [p.x, dist * 0.75, p.z + dist * 0.55], look: [p.x, 0, p.z],
      label: 'Slide ' + (SLIDE_MAP[page] || page) };
  }
  if (s === BACK_OVERVIEW) {
    return { folds: new Array(NUM_FOLDS).fill(0), central: 0, flipAngle: Math.PI,
      ...ov, label: 'Full back side' };
  }
  return { folds: new Array(NUM_FOLDS).fill(0), central: 0, flipAngle: 0, ...ov, label: '?' };
}

// ─── NAVIGATION ────────────────────────────────────────────────────────────
let step = 0;
function goTo(s) {
  step = Math.max(0, Math.min(TOTAL_STEPS - 1, s));
  const c = getStepConfig(step);
  for (let f = 0; f < NUM_FOLDS; f++) target.folds[f] = c.folds[f];
  target.central   = c.central;
  target.flipAngle = c.flipAngle;
  camPosT.set(...c.pos);
  camLookT.set(...c.look);
  document.getElementById('info').textContent = c.label;
}

// ─── PAPER FLIP DEFORMATION (single-corner page-flip with diagonal droop) ──
// Composition of two transforms applied in the original flat-paper world frame:
//   1. Developable hinge bend along the TL->BR diagonal. Only vertices on the
//      BL side of this diagonal are rotated about the diagonal axis (TL and
//      BR sit on the axis and are fixed by the bend). Bend angle peaks at
//      p=0.5 (MAX_BEND ≈ 1.2 rad ≈ 69°) and is zero at both endpoints, so
//      the paper is perfectly flat at p∈{0,1}. The rotation sign sends the
//      BL side DOWN in the flat frame, so the subsequent global rotation's
//      lift turns that into a visible sag of the lifted corner — gravity
//      droop along the diagonal opposite the "grabbed" corner.
//   2. Rigid rotation about the vertical (+Z) axis through the world origin
//      by angle φ = π·p, with a compensating Y-lift  +(W/2 − wx)·sinφ  that
//      keeps the right edge x=+W/2 anchored on the table (y=0). The right
//      edge traces a near-stationary pivot while the left edge swings up
//      and over; at φ=π the transform reduces to (wx,0,wz) → (−wx,0,wz),
//      i.e. the exact X mirror the baked back-side labels in makeBakedTex
//      assume (do not touch that).
// Easing (p = ½ − ½·cos(π·progressRaw)) is applied INSIDE this function so
// the linear lerp in update() still hits the endpoints cleanly.
function applyRollDeformation(progressRaw) {
  const last = paperGroup.userData.lastRollP;
  if (last !== undefined && Math.abs(progressRaw - last) < 0.0005
      && (progressRaw === 0 || progressRaw === 1)) return;
  paperGroup.userData.lastRollP = progressRaw;

  const p = 0.5 - 0.5 * Math.cos(Math.PI * progressRaw);

  // Rigid rotation angle about +Z through the origin.
  const phi = Math.PI * p;
  const cosF = Math.cos(phi);
  const sinF = Math.sin(phi);

  // Developable hinge bend along TL->BR diagonal (in y=0 plane).
  const MAX_BEND = 1.2;
  const A = MAX_BEND * Math.sin(Math.PI * p);
  const cA = Math.cos(A);
  const sA = Math.sin(A);
  const diagLen = Math.hypot(W, H);
  const ax = W / diagLen;   // axis x-component (TL -> BR direction)
  const az = H / diagLen;   // axis z-component
  // Side metric: sigma = wz*ax - wx*az.  > 0 on the BL side.

  for (const entry of allPanelMeshes) {
    const { mesh, geo, isFront } = entry;
    const panelGroup = mesh.parent;
    const panelWorldPos = new THREE.Vector3();
    panelGroup.getWorldPosition(panelWorldPos);
    const panelX = panelWorldPos.x;
    const panelZ = panelWorldPos.z;

    const pos = geo.attributes.position;

    if (!geo.userData.origX) {
      geo.userData.origX = new Float32Array(pos.count);
      geo.userData.origY = new Float32Array(pos.count);
      geo.userData.origZ = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        geo.userData.origX[i] = pos.getX(i);
        geo.userData.origY[i] = pos.getY(i);
        geo.userData.origZ[i] = pos.getZ(i);
      }
    }
    const ox = geo.userData.origX;
    const oy = geo.userData.origY;
    const oz = geo.userData.origZ;

    // Front mesh: rotation.x = -PI/2 maps local +Z -> world +Y, local +Y -> world -Z.
    // Back  mesh: rotation.x = +PI/2 maps local +Z -> world -Y, local +Y -> world +Z.
    // With s = +1 (front) or -1 (back):
    //   wy = s * oz,   wz = panelZ - s * oy,   wx = panelX + ox.
    const s = isFront ? 1 : -1;

    for (let i = 0; i < pos.count; i++) {
      let wx = panelX + ox[i];
      let wy = s * oz[i];
      let wz = panelZ - s * oy[i];

      // 1. Diagonal hinge bend (BL side only). Rodrigues rotation about
      //    axis (ax, 0, az) by angle A. The rotation drops BL-side vertices
      //    in the flat frame; once the rigid rotation lifts the sheet this
      //    reads as the lifted corner sagging under gravity.
      const sigma = wz * ax - wx * az;
      if (sigma > 0 && A > 1e-5) {
        const dot = ax * wx + az * wz;          // a . v   (ay = 0)
        const cxX = -az * wy;                   // (a x v).x
        const cxY = az * wx - ax * wz;          // (a x v).y
        const cxZ = ax * wy;                    // (a x v).z
        const k = 1 - cA;
        const bx = wx * cA + cxX * sA + ax * dot * k;
        const by = wy * cA + cxY * sA;          // ay*dot*k = 0
        const bz = wz * cA + cxZ * sA + az * dot * k;
        wx = bx; wy = by; wz = bz;
      }

      // 2. Rigid rotation about +Z through origin by -φ, plus a compensating
      //    +Y lift of (W/2 − wx)·sinφ that pins the right edge (x=+W/2) to
      //    y=0 throughout. At φ=π this collapses to (wx,wy,wz)→(−wx,−wy,wz),
      //    which on the flat sheet is the exact X mirror the baked
      //    back-side labels assume.
      const nwx = wx * cosF + wy * sinF;
      const nwy = (W / 2 - wx) * sinF + wy * cosF;
      const nwz = wz;

      // world -> local
      pos.setX(i, nwx - panelX);
      pos.setY(i, s * (panelZ - nwz));
      pos.setZ(i, s * nwy);
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
  }
}

// ─── RENDER LOOP ───────────────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }

function update(dt) {
  // Frame-rate-independent exponential approach; characteristic time ~0.25s.
  // Survives wildly varying dt (e.g. throttled background tabs).
  const t = 1 - Math.exp(-dt * 4);

  for (let f = 0; f < NUM_FOLDS; f++) {
    state.folds[f] = lerp(state.folds[f], target.folds[f], t);
    leftData.hinges[f].rotation.x  = state.folds[f];
    rightData.hinges[f].rotation.x = state.folds[f];
    const progress = state.folds[f] / Math.PI;
    leftData.hinges[f].position.y  = progress * STACK_GAP * (NUM_FOLDS - f) * ((f % 2 === 0) ? 1 : -1);
    rightData.hinges[f].position.y = progress * STACK_GAP * (NUM_FOLDS - f) * ((f % 2 === 0) ? 1 : -1);
  }

  state.central = lerp(state.central, target.central, t);
  centralHinge.rotation.z = state.central;
  centralHinge.position.y = (Math.abs(state.central) / Math.PI) * STACK_GAP * (NUM_FOLDS + 1) * 3;

  state.flipAngle = lerp(state.flipAngle, target.flipAngle, t);
  applyRollDeformation(state.flipAngle / Math.PI);

  const camT = 1 - Math.exp(-dt * 3);
  camera.position.lerp(camPosT, camT);
  controls.target.lerp(camLookT, camT);
  controls.update();
}

const clock = new THREE.Clock();
function startLoop() {
  // rAF for smooth playback when the tab is visible.
  (function loop() {
    requestAnimationFrame(loop);
    if (!document.hidden) {
      update(clock.getDelta());
      renderer.render(scene, camera);
    }
  })();
  // setInterval fallback so the simulation keeps advancing when the tab is
  // backgrounded — important for screenshot-driven testing where the page
  // can be hidden but we still need state.flipAngle to lerp toward target.
  let lastBgT = performance.now();
  setInterval(() => {
    if (!document.hidden) { lastBgT = performance.now(); return; }
    const now = performance.now();
    const dt = Math.min((now - lastBgT) / 1000, 0.05);
    lastBgT = now;
    // Reset the rAF Clock so it doesn't accumulate huge dt when the tab
    // becomes visible again.
    clock.getDelta();
    update(dt);
    renderer.render(scene, camera);
  }, 33);
}

// ─── INIT ──────────────────────────────────────────────────────────────────
paperImageReady.then(() => {
  buildPaper();
  paperGroup.userData.lastRollP = 0;

  // Auto-debug: snap to folded state and log stacking order
  goTo(0);
  // Force instant snap
  for (let f = 0; f < NUM_FOLDS; f++) {
    state.folds[f] = target.folds[f];
    leftData.hinges[f].rotation.x  = state.folds[f];
    rightData.hinges[f].rotation.x = state.folds[f];
    const progress = state.folds[f] / Math.PI;
    leftData.hinges[f].position.y  = progress * STACK_GAP * (NUM_FOLDS - f) * ((f % 2 === 0) ? 1 : -1);
    rightData.hinges[f].position.y = progress * STACK_GAP * (NUM_FOLDS - f) * ((f % 2 === 0) ? 1 : -1);
  }
  state.central = target.central;
  centralHinge.rotation.z = state.central;
  centralHinge.position.y = (Math.abs(state.central) / Math.PI) * STACK_GAP * (NUM_FOLDS + 1) * 3;
  scene.updateMatrixWorld(true);
  setTimeout(() => debugStack(), 100);

  // ─── DEBUG: stacking order when folded ──────────────────────────────────
  function debugStack() {
    // Snap to fully folded, compute world Y of each panel center, sort, print
    const entries = [];
    for (const entry of allPanelMeshes) {
      const { mesh, isFront } = entry;
      const wp = new THREE.Vector3();
      mesh.getWorldPosition(wp);
      // Determine which page this mesh shows
      const label = mesh.material.map?.name || mesh.material.map?.image?.label || '?';
      entries.push({
        y: wp.y,
        x: wp.x.toFixed(3),
        z: wp.z.toFixed(3),
        side: isFront ? 'F' : 'B',
        label
      });
    }
    // Also compute from the panel groups
    const panelEntries = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const fp = frontPage(r, c);
        const bp = backPage(r, c);
        // Count how many rotations this row accumulates
        const col = c;
        const data = col === 0 ? leftData : rightData;
        let numRots = 0;
        // Row r is in hinges 0...(NUM_FOLDS - 1 - (ROWS-1-r)) when counting from innermost
        // Actually: row f's panel is attached to hinge[f] (for f < ROWS-1) or is the base (f=ROWS-1)
        if (r < ROWS - 1) {
          // This row's panel is in hinge[r] and all outer hinges
          numRots = NUM_FOLDS - r;  // hinges r, r+1, ..., NUM_FOLDS-1 but wait...
        }
        // Let's just read the world position
        panelEntries.push({ row: r, col: c, fp, bp });
      }
    }

    // Compute world Y for each panel group by traversing hierarchy
    console.log('=== STACKING ORDER (fully folded) ===');
    console.log('Row | Col | Front# | Back# | WorldY');
    console.log('----+-----+--------+-------+-------');
    
    // For each mesh, extract page info from the texture
    const sorted = [];
    allPanelMeshes.forEach(({ mesh, isFront }) => {
      const wp = new THREE.Vector3();
      mesh.getWorldPosition(wp);
      const parent = mesh.parent; // the panel group
      const pgp = new THREE.Vector3();
      parent.getWorldPosition(pgp);
      sorted.push({ y: pgp.y, isFront, worldPos: pgp });
    });

    // Group by panel group (front+back share parent)
    const groups = new Map();
    allPanelMeshes.forEach(({ mesh, isFront }) => {
      const parent = mesh.parent;
      if (!groups.has(parent)) {
        const wp = new THREE.Vector3();
        parent.getWorldPosition(wp);
        groups.set(parent, { y: wp.y, x: wp.x, z: wp.z });
      }
    });

    // Map panel groups to their row/col by matching build order
    // buildColumn creates panels in order: baseRow (ROWS-1), then f from NUM_FOLDS-1 down to 0
    // So row order is: ROWS-1, ROWS-2, ROWS-3, ..., 0
    const leftPanels = [];  // panels in left column, in build order
    const rightPanels = []; // panels in right column
    let idx = 0;
    for (const { mesh } of allPanelMeshes) {
      const parent = mesh.parent;
      const col = idx < allPanelMeshes.length / 2 ? 1 : 0; // right built first
      idx++;
    }

    // Simpler approach: just log world Y of all panel meshes with their index
    console.log('Panel mesh world positions (sorted by Y descending = top first):');
    const allPositions = [];
    for (let i = 0; i < allPanelMeshes.length; i += 2) {
      // Each panel has front (i) and back (i+1) mesh
      const front = allPanelMeshes[i];
      const back = allPanelMeshes[i + 1];
      const wp = new THREE.Vector3();
      front.mesh.parent.getWorldPosition(wp);
      const panelIdx = Math.floor(i / 2);
      // Determine row/col from build order
      // Right column built first: base(row5), then rows 4,3,2,1,0
      // Left column built second: base(row5), then rows 4,3,2,1,0
      const isRight = panelIdx < ROWS;
      const col = isRight ? 1 : 0;
      const rowInCol = isRight ? panelIdx : panelIdx - ROWS;
      // Build order: base=ROWS-1, then ROWS-2, ..., 0
      const row = rowInCol === 0 ? ROWS - 1 : ROWS - 1 - rowInCol;
      allPositions.push({
        row, col,
        fp: frontPage(row, col),
        bp: backPage(row, col),
        y: wp.y.toFixed(4),
        x: wp.x.toFixed(3),
        faceUp: front.mesh.getWorldDirection(new THREE.Vector3()).y > 0 ? 'front' : 'back'
      });
    }
    allPositions.sort((a, b) => parseFloat(b.y) - parseFloat(a.y));
    allPositions.forEach(p => {
      console.log(`  Y=${p.y} row=${p.row} col=${p.col} fp=${p.fp} bp=${p.bp} faceUp=${p.faceUp}`);
    });
  }

  // expose for debugging
  window.__SLICC = { state, target, paperGroup, allPanelMeshes, scene, camera, debugStack,
    snap: () => {
      // Instantly drive the simulation to its current target — useful for
      // background-tab screenshot testing where rAF / setInterval are
      // heavily throttled so the time-based lerp can't complete.
      for (let f = 0; f < NUM_FOLDS; f++) {
        state.folds[f] = target.folds[f];
        leftData.hinges[f].rotation.x  = state.folds[f];
        rightData.hinges[f].rotation.x = state.folds[f];
        const progress = state.folds[f] / Math.PI;
        leftData.hinges[f].position.y  = progress * STACK_GAP * (NUM_FOLDS - f) * ((f % 2 === 0) ? 1 : -1);
        rightData.hinges[f].position.y = progress * STACK_GAP * (NUM_FOLDS - f) * ((f % 2 === 0) ? 1 : -1);
      }
      state.central   = target.central;
      state.flipAngle = target.flipAngle;
      centralHinge.rotation.z = state.central;
      centralHinge.position.y = (Math.abs(state.central) / Math.PI) * STACK_GAP * (NUM_FOLDS + 1) * 3;
      applyRollDeformation(state.flipAngle / Math.PI);
      camera.position.copy(camPosT);
      controls.target.copy(camLookT);
      renderer.render(scene, camera);
    },
    setFlip: (progress) => {
      // Hold the simulation at a specific flip progress (0 unflipped, 1 flipped)
      // for inspection without lerp interference.
      for (let f = 0; f < NUM_FOLDS; f++) {
        state.folds[f] = 0;
        target.folds[f] = 0;
        leftData.hinges[f].rotation.x  = 0;
        rightData.hinges[f].rotation.x = 0;
        leftData.hinges[f].position.y  = 0;
        rightData.hinges[f].position.y = 0;
      }
      state.central = 0; target.central = 0;
      centralHinge.rotation.z = 0;
      centralHinge.position.y = 0;
      state.flipAngle = progress * Math.PI;
      target.flipAngle = progress * Math.PI;
      applyRollDeformation(progress);
      renderer.render(scene, camera);
    }
  };
  window.__setRoll = window.__SLICC.setFlip;

  goTo(0);
  for (let f = 0; f < NUM_FOLDS; f++) {
    state.folds[f] = target.folds[f];
    leftData.hinges[f].rotation.x  = state.folds[f];
    rightData.hinges[f].rotation.x = state.folds[f];
  }
  state.central   = target.central;
  state.flipAngle = target.flipAngle;
  centralHinge.rotation.z = state.central;
  applyRollDeformation(state.flipAngle / Math.PI);
  camera.position.copy(camPosT);
  controls.target.copy(camLookT);
  startLoop();
});

// ─── INPUT ─────────────────────────────────────────────────────────────────
document.getElementById('next').onclick = () => goTo(step + 1);
document.getElementById('prev').onclick = () => goTo(step - 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(step + 1); }
  else if (e.key === 'ArrowLeft')              { e.preventDefault(); goTo(step - 1); }
  else if (e.key === 'Home')                   goTo(0);
  else if (e.key === 'End')                    goTo(TOTAL_STEPS - 1);
});
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
